name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FieldMap-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release (easy download on phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FieldMap.apk
          gh release create "apk-${{ github.run_number }}" FieldMap.apk \
            --title "FieldMap APK #${{ github.run_number }}" \
            --notes "Install FieldMap.apk on your Android phone."
